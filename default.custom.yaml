patch:
  "menu/page_size": 5
  "key_binder/select_first_character": "Control+bracketleft"
  "key_binder/select_last_character": "Control+bracketright"
  "key_binder/bindings/@0": { when: has_menu, accept: "Shift+Tab", send: Page_Up }
  "key_binder/bindings/@1": { when: has_menu, accept: Tab, send: Page_Down }
  "key_binder/bindings/+":
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: always, accept: "Shift+space", toggle: full_shape }
